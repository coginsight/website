<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" fill="none">
  <defs>
    <!-- Topographic brain pattern -->
    <pattern id="topoLines" patternUnits="userSpaceOnUse" width="80" height="80">
      <path d="M10,40 Q25,20 40,35 Q55,50 70,30" stroke="#c4cdd5" stroke-width="1" fill="none"/>
      <path d="M5,60 Q20,45 35,55 Q50,65 65,50 Q80,35 75,55" stroke="#c4cdd5" stroke-width="1" fill="none"/>
      <path d="M15,15 Q30,25 25,40 Q20,55 35,65" stroke="#c4cdd5" stroke-width="1" fill="none"/>
      <path d="M60,10 Q70,25 65,40 Q60,55 75,70" stroke="#c4cdd5" stroke-width="1" fill="none"/>
      <path d="M0,25 Q15,35 10,50 Q5,65 20,75" stroke="#c4cdd5" stroke-width="1" fill="none"/>
      <circle cx="40" cy="40" r="12" stroke="#c4cdd5" stroke-width="1" fill="none"/>
      <circle cx="40" cy="40" r="6" stroke="#c4cdd5" stroke-width="1" fill="none"/>
    </pattern>

    <!-- Subtle grid for right side of intersection -->
    <pattern id="gridPattern" patternUnits="userSpaceOnUse" width="12" height="12">
      <path d="M12,0 L0,0 0,12" stroke="#e8c4c4" stroke-width="0.5" fill="none" opacity="0.6"/>
    </pattern>

    <!-- Clip paths -->
    <clipPath id="leftClip">
      <circle cx="200" cy="180" r="160"/>
    </clipPath>
    <clipPath id="rightClip">
      <circle cx="420" cy="180" r="160"/>
    </clipPath>
  </defs>

  <!-- Left circle fill -->
  <circle cx="200" cy="180" r="160" fill="#ffffff"/>

  <!-- Right circle fill -->
  <circle cx="420" cy="180" r="160" fill="#ffffff"/>

  <!-- Intersection: topographic pattern -->
  <g clip-path="url(#leftClip)">
    <circle cx="420" cy="180" r="160" fill="url(#topoLines)"/>
  </g>

  <!-- Grid overlay on right half of intersection -->
  <g clip-path="url(#leftClip)">
    <g clip-path="url(#rightClip)">
      <rect x="310" y="20" width="200" height="320" fill="url(#gridPattern)"/>
    </g>
  </g>

  <!-- Circle outlines (thin) -->
  <circle cx="200" cy="180" r="160" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <circle cx="420" cy="180" r="160" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Bold intersection outline - proper lens shape using circle arcs -->
  <!-- Intersection points: (310, 64) and (310, 296) -->
  <!-- Left arc: from top to bottom, curving left (part of left circle, r=160) -->
  <!-- Right arc: from bottom to top, curving right (part of right circle, r=160) -->
  <path d="M310,64 A160,160 0 0,1 310,296 A160,160 0 0,1 310,64" fill="none" stroke="#1e3a5f" stroke-width="3"/>

  <!-- Left text -->
  <text x="118" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1e3a5f" text-anchor="middle">
    <tspan x="118" dy="0">Health</tspan>
    <tspan x="118" dy="26">Science</tspan>
  </text>
  <text x="118" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">
    <tspan x="118" dy="0">Metric Design,</tspan>
    <tspan x="118" dy="18">Clinical Validation,</tspan>
    <tspan x="118" dy="18">Bayesian Modeling</tspan>
  </text>

  <!-- Center text -->
  <text x="310" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f" text-anchor="middle">
    <tspan x="310" dy="0">Cognitive</tspan>
    <tspan x="310" dy="24">Insight</tspan>
  </text>

  <!-- Right text -->
  <text x="502" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1e3a5f" text-anchor="middle">
    <tspan x="502" dy="0">AI</tspan>
    <tspan x="502" dy="26">Engineering</tspan>
  </text>
  <text x="502" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">
    <tspan x="502" dy="0">Production Systems,</tspan>
    <tspan x="502" dy="18">LLM & Agentic,</tspan>
    <tspan x="502" dy="18">FDA-Ready AI</tspan>
  </text>

  <!-- Connector line -->
  <line x1="580" y1="180" x2="640" y2="180" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Description box -->
  <rect x="640" y="80" width="240" height="200" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Description text -->
  <text x="660" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4b5563">
    <tspan x="660" dy="0">We build the science and</tspan>
    <tspan x="660" dy="22">AI behind validated digital</tspan>
    <tspan x="660" dy="22">health—combining deep</tspan>
    <tspan x="660" dy="22">health science with</tspan>
    <tspan x="660" dy="22">production AI engineering,</tspan>
    <tspan x="660" dy="22">unified by regulatory</tspan>
  </text>
  <text x="660" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#dc6b6b">fluency.</text>
</svg>