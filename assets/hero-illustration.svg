<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <!-- Gradient for the lines -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGradientPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b21b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g class="illustration" stroke="url(#lineGradient)" stroke-width="1.5" fill="none">
    <!-- LEFT SIDE: Organic brain-like curves and spirals -->

    <!-- Large flowing curves -->
    <path d="M50,300 Q100,200 80,150 Q60,100 100,80 Q150,60 180,100 Q210,140 200,200 Q190,260 220,280" opacity="0.6"/>
    <path d="M30,350 Q80,380 100,340 Q120,300 90,260 Q60,220 100,180 Q140,140 120,100" opacity="0.5"/>
    <path d="M60,400 Q120,420 150,380 Q180,340 160,290 Q140,240 180,200 Q220,160 200,120 Q180,80 220,60" opacity="0.6"/>

    <!-- Spiral formations -->
    <path d="M150,320 Q180,300 170,270 Q160,240 190,230 Q220,220 210,250 Q200,280 230,290 Q260,300 250,270 Q240,240 270,230" opacity="0.7"/>
    <path d="M100,250 Q130,230 120,200 Q110,170 140,160 Q170,150 160,180 Q150,210 180,220" opacity="0.5"/>

    <!-- Small circular clusters (like cellular structures) -->
    <circle cx="80" cy="450" r="25" opacity="0.4"/>
    <circle cx="95" cy="440" r="15" opacity="0.3"/>
    <circle cx="70" cy="465" r="12" opacity="0.3"/>
    <circle cx="105" cy="460" r="10" opacity="0.25"/>

    <circle cx="180" cy="480" r="20" opacity="0.35"/>
    <circle cx="195" cy="470" r="12" opacity="0.25"/>
    <circle cx="170" cy="495" r="10" opacity="0.25"/>

    <!-- More organic flowing lines -->
    <path d="M40,200 Q70,180 60,140 Q50,100 90,90 Q130,80 150,120 Q170,160 150,200 Q130,240 170,260 Q210,280 200,320" opacity="0.5"/>
    <path d="M20,280 Q60,260 50,220 Q40,180 80,160 Q120,140 140,180 Q160,220 140,260" opacity="0.4"/>

    <!-- Tendrils extending outward -->
    <path d="M10,150 Q40,140 50,170 Q60,200 40,220" opacity="0.3"/>
    <path d="M5,250 Q30,240 40,270 Q50,300 30,320" opacity="0.3"/>
    <path d="M15,380 Q45,370 55,400 Q65,430 45,450" opacity="0.3"/>
    <path d="M25,450 Q55,460 50,490 Q45,520 70,540" opacity="0.3"/>

    <!-- Inner details - smaller spirals -->
    <path d="M200,180 Q220,170 215,150 Q210,130 230,125 Q250,120 245,140 Q240,160 260,165" opacity="0.5"/>
    <path d="M130,350 Q160,340 155,310 Q150,280 175,275 Q200,270 195,295" opacity="0.4"/>

    <!-- Flowing connections -->
    <path d="M220,300 Q260,290 280,310 Q300,330 280,360 Q260,390 290,410" opacity="0.5"/>
    <path d="M200,380 Q240,370 260,400 Q280,430 260,460" opacity="0.4"/>
    <path d="M180,150 Q220,140 250,170 Q280,200 260,240" opacity="0.5"/>

    <!-- CENTER: Converging transition lines -->
    <path d="M280,150 Q350,180 450,220 L550,260" opacity="0.6" stroke-width="1"/>
    <path d="M260,200 Q340,220 440,250 L550,280" opacity="0.6" stroke-width="1"/>
    <path d="M290,260 Q360,270 450,285 L550,300" opacity="0.7" stroke-width="1.2"/>
    <path d="M280,300 Q360,300 450,300 L550,300" opacity="0.8" stroke-width="1.5"/>
    <path d="M290,340 Q360,330 450,315 L550,300" opacity="0.7" stroke-width="1.2"/>
    <path d="M260,400 Q340,380 440,350 L550,320" opacity="0.6" stroke-width="1"/>
    <path d="M280,450 Q350,420 450,380 L550,340" opacity="0.6" stroke-width="1"/>

    <!-- Additional organic-to-structured transition curves -->
    <path d="M250,120 Q320,140 420,190 L520,240" opacity="0.4" stroke-width="1"/>
    <path d="M240,480 Q320,450 420,400 L520,360" opacity="0.4" stroke-width="1"/>

    <!-- RIGHT SIDE: Geometric structures and networks -->

    <!-- Main central hub -->
    <circle cx="580" cy="300" r="8" fill="#0d9488" opacity="0.9"/>

    <!-- Primary geometric shape - large octahedron -->
    <g transform="translate(700, 200)">
      <polygon points="0,-60 50,0 0,60 -50,0" stroke-width="1.2" opacity="0.7"/>
      <line x1="0" y1="-60" x2="0" y2="60" opacity="0.4"/>
      <line x1="-50" y1="0" x2="50" y2="0" opacity="0.4"/>
      <!-- Nodes -->
      <circle cx="0" cy="-60" r="5" fill="#0d9488" opacity="0.9"/>
      <circle cx="50" cy="0" r="5" fill="#0d9488" opacity="0.9"/>
      <circle cx="0" cy="60" r="5" fill="#0d9488" opacity="0.9"/>
      <circle cx="-50" cy="0" r="5" fill="#0d9488" opacity="0.9"/>
    </g>

    <!-- Secondary geometric shape - icosahedron-like -->
    <g transform="translate(850, 300)">
      <polygon points="0,-50 45,-20 45,25 0,50 -45,25 -45,-20" stroke-width="1.2" opacity="0.7"/>
      <line x1="0" y1="-50" x2="0" y2="50" opacity="0.3"/>
      <line x1="-45" y1="-20" x2="45" y2="25" opacity="0.3"/>
      <line x1="-45" y1="25" x2="45" y2="-20" opacity="0.3"/>
      <!-- Inner structure -->
      <polygon points="0,-25 22,-10 22,12 0,25 -22,12 -22,-10" opacity="0.4"/>
      <!-- Nodes -->
      <circle cx="0" cy="-50" r="5" fill="#0d9488" opacity="0.9"/>
      <circle cx="45" cy="-20" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="45" cy="25" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="0" cy="50" r="5" fill="#0d9488" opacity="0.9"/>
      <circle cx="-45" cy="25" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="-45" cy="-20" r="4" fill="#0d9488" opacity="0.9"/>
    </g>

    <!-- Smaller geometric shape - top -->
    <g transform="translate(780, 100)">
      <polygon points="0,-35 30,0 0,35 -30,0" stroke-width="1" opacity="0.6"/>
      <line x1="-30" y1="0" x2="30" y2="0" opacity="0.3"/>
      <circle cx="0" cy="-35" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="30" cy="0" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="0" cy="35" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="-30" cy="0" r="4" fill="#0d9488" opacity="0.9"/>
    </g>

    <!-- Smaller geometric shape - bottom -->
    <g transform="translate(780, 480)">
      <polygon points="0,-35 30,0 0,35 -30,0" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="-35" x2="0" y2="35" opacity="0.3"/>
      <circle cx="0" cy="-35" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="30" cy="0" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="0" cy="35" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="-30" cy="0" r="4" fill="#0d9488" opacity="0.9"/>
    </g>

    <!-- Network connections between geometric shapes -->
    <line x1="700" y1="140" x2="750" y2="100" opacity="0.5"/>
    <line x1="750" y1="200" x2="780" y2="135" opacity="0.5"/>
    <line x1="750" y1="200" x2="805" y2="250" opacity="0.5"/>
    <line x1="700" y1="260" x2="805" y2="280" opacity="0.5"/>
    <line x1="580" y1="300" x2="650" y2="200" opacity="0.6"/>
    <line x1="580" y1="300" x2="700" y2="260" opacity="0.6"/>
    <line x1="580" y1="300" x2="805" y2="300" opacity="0.6"/>
    <line x1="580" y1="300" x2="700" y2="340" opacity="0.6"/>
    <line x1="700" y1="340" x2="805" y2="320" opacity="0.5"/>
    <line x1="750" y1="400" x2="780" y2="445" opacity="0.5"/>
    <line x1="700" y1="460" x2="750" y2="480" opacity="0.5"/>
    <line x1="895" y1="300" x2="950" y2="280" opacity="0.5"/>
    <line x1="895" y1="325" x2="950" y2="350" opacity="0.5"/>

    <!-- Data representation elements - small rectangles -->
    <g transform="translate(950, 180)">
      <rect x="0" y="0" width="40" height="8" rx="2" opacity="0.4"/>
      <rect x="0" y="14" width="30" height="8" rx="2" opacity="0.3"/>
      <rect x="0" y="28" width="35" height="8" rx="2" opacity="0.35"/>
    </g>

    <g transform="translate(950, 270)">
      <rect x="0" y="0" width="35" height="8" rx="2" opacity="0.4"/>
      <rect x="0" y="14" width="45" height="8" rx="2" opacity="0.35"/>
    </g>

    <g transform="translate(950, 340)">
      <rect x="0" y="0" width="30" height="8" rx="2" opacity="0.3"/>
      <rect x="0" y="14" width="40" height="8" rx="2" opacity="0.4"/>
      <rect x="0" y="28" width="25" height="8" rx="2" opacity="0.3"/>
    </g>

    <!-- Cube structure - far right -->
    <g transform="translate(1020, 220)">
      <polygon points="0,0 40,0 40,40 0,40" opacity="0.4"/>
      <polygon points="0,0 15,-15 55,-15 40,0" opacity="0.3"/>
      <polygon points="40,0 55,-15 55,25 40,40" opacity="0.35"/>
      <circle cx="0" cy="0" r="3" fill="#0d9488" opacity="0.8"/>
      <circle cx="40" cy="0" r="3" fill="#0d9488" opacity="0.8"/>
      <circle cx="55" cy="-15" r="3" fill="#0d9488" opacity="0.8"/>
      <circle cx="40" cy="40" r="3" fill="#0d9488" opacity="0.8"/>
    </g>

    <!-- Network grid - bottom right -->
    <g transform="translate(1000, 380)">
      <line x1="0" y1="0" x2="40" y2="0" opacity="0.4"/>
      <line x1="0" y1="20" x2="40" y2="20" opacity="0.4"/>
      <line x1="0" y1="40" x2="40" y2="40" opacity="0.4"/>
      <line x1="0" y1="0" x2="0" y2="40" opacity="0.4"/>
      <line x1="20" y1="0" x2="20" y2="40" opacity="0.4"/>
      <line x1="40" y1="0" x2="40" y2="40" opacity="0.4"/>
      <circle cx="0" cy="0" r="3" fill="#0d9488" opacity="0.7"/>
      <circle cx="20" cy="0" r="3" fill="#0d9488" opacity="0.7"/>
      <circle cx="40" cy="0" r="3" fill="#0d9488" opacity="0.7"/>
      <circle cx="0" cy="20" r="3" fill="#0d9488" opacity="0.7"/>
      <circle cx="20" cy="20" r="4" fill="#0d9488" opacity="0.9"/>
      <circle cx="40" cy="20" r="3" fill="#0d9488" opacity="0.7"/>
      <circle cx="0" cy="40" r="3" fill="#0d9488" opacity="0.7"/>
      <circle cx="20" cy="40" r="3" fill="#0d9488" opacity="0.7"/>
      <circle cx="40" cy="40" r="3" fill="#0d9488" opacity="0.7"/>
    </g>

    <!-- Small terminal nodes extending to edge -->
    <line x1="1060" y1="220" x2="1100" y2="200" opacity="0.3"/>
    <circle cx="1100" cy="200" r="2" fill="#1a365d" opacity="0.5"/>
    <line x1="1060" y1="260" x2="1120" y2="270" opacity="0.3"/>
    <circle cx="1120" cy="270" r="2" fill="#1a365d" opacity="0.5"/>
    <line x1="1040" y1="420" x2="1080" y2="450" opacity="0.3"/>
    <circle cx="1080" cy="450" r="2" fill="#1a365d" opacity="0.5"/>
    <line x1="990" y1="290" x2="1050" y2="300" opacity="0.4"/>
    <line x1="990" y1="360" x2="1020" y2="380" opacity="0.4"/>

    <!-- Additional accent nodes at key positions -->
    <circle cx="550" cy="260" r="4" fill="#0d9488" opacity="0.7"/>
    <circle cx="550" cy="340" r="4" fill="#0d9488" opacity="0.7"/>
    <circle cx="620" cy="220" r="3" fill="#0d9488" opacity="0.6"/>
    <circle cx="620" cy="380" r="3" fill="#0d9488" opacity="0.6"/>
  </g>
</svg>
