<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" fill="none">
  <!-- Simple flow logo: Organic wave to data points -->

  <!-- Left: Single organic brain-like curve -->
  <path d="M4,16 Q8,6 12,16 Q16,26 20,16" stroke="#1a365d" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Flowing connection -->
  <path d="M20,16 Q24,16 28,10" stroke="#1a365d" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M20,16 Q24,16 28,16" stroke="#1a365d" stroke-width="2" fill="none"/>
  <path d="M20,16 Q24,16 28,22" stroke="#1a365d" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Right: Three connected nodes (structured output) -->
  <circle cx="32" cy="10" r="3" fill="#0d9488"/>
  <circle cx="32" cy="16" r="4" fill="#1a365d"/>
  <circle cx="32" cy="22" r="3" fill="#0d9488"/>

  <!-- Horizontal connections to outer nodes -->
  <line x1="35" y1="10" x2="42" y2="10" stroke="#1a365d" stroke-width="1.5"/>
  <line x1="36" y1="16" x2="44" y2="16" stroke="#1a365d" stroke-width="1.5"/>
  <line x1="35" y1="22" x2="42" y2="22" stroke="#1a365d" stroke-width="1.5"/>

  <circle cx="42" cy="10" r="2" fill="#0d9488" opacity="0.7"/>
  <circle cx="44" cy="16" r="2.5" fill="#0d9488"/>
  <circle cx="42" cy="22" r="2" fill="#0d9488" opacity="0.7"/>
</svg>